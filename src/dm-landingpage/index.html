<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" href="/favicon.svg" sizes="any" type="image/svg+xml">
    <title>divemap.io - We're Building Something New!</title>

    <meta name="description" content="Discover the best dive sites around the world with our interactive map. Plan your next diving adventure and explore the underwater world!">
    <meta property="og:title" content="Dive Sites Interactive Map - divemap.io">
    <meta property="og:description" data-vmid="ogdescription" content="Discover the best dive sites around the world with our interactive map. Plan your next diving adventure and explore the underwater world!">
    <meta property="og:image" data-vmid="ogimage" content="https://app.divemap.io/logo_rec.jpg">
    <meta property="og:image:width" data-vmid="ogimagewidth" content="417">
    <meta property="og:image:height" data-vmid="ogimageheight" content="185">
    <meta property="og:image:alt" content="divemap.io logo">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://app.divemap.io">
    <meta property="og:site_name" content="divemap.io">

    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="Dive Sites Interactive Map - divemap.io">
    <meta name="twitter:description" data-vmid="twitterdescription" content="Discover the best dive sites around the world with our interactive map. Plan your next diving adventure and explore the underwater world!">
    <meta name="twitter:image" data-vmid="twitterimage" content="https://app.divemap.io/logo_rec.jpg">
    <meta name="twitter:image:alt" content="divemap.io logo">
    <meta name="twitter:url" content="https://app.divemap.io">
    <meta name="twitter:site" content="@divemapio">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;700&family=Quicksand:wght@400;600&family=Sen:wght@400;700&display=swap');

        :root {
            --color-bg:               #162D30;
            --color-accent-yellow:    #DADC35;
            --color-blue-light:       #BCE4F5;
            --color-blue-mid:         #09A3D3;
            --color-teal:             #3A737D;
            --color-teal-dark:        #1E3E42;

            --font-heading: 'Comfortaa', 'Trebuchet MS', sans-serif;
            --font-body:    'Quicksand', 'Segoe UI', sans-serif;
            --font-accent:  'Sen', 'Arial', sans-serif;

            --text-base: 1rem;
            --text-sm:   0.8rem;
            --text-2xl:  2.441rem;
            --text-3xl:  3.052rem;

            --space-2: 0.5rem;
            --space-3: 0.75rem;
            --space-4: 1rem;
            --space-6: 1.5rem;
            --space-8: 2rem;

            --radius-md:   8px;
            --radius-full: 9999px;

            --shadow-glow-blue: 0 0 16px rgba(9, 163, 211, 0.35);

            --transition-normal: 250ms ease;
            --transition-slow:   400ms ease;
            --transition-bounce: 300ms cubic-bezier(0.34, 1.56, 0.64, 1);

            --max-width-content: 720px;
        }

        *, *::before, *::after { box-sizing: border-box; }

        body {
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: var(--space-8);
            overflow: hidden;
            font-family: var(--font-body);
            font-size: var(--text-base);
            color: var(--color-blue-light);
            background-color: var(--color-bg);
            background-image:
                radial-gradient(ellipse 80% 60% at 15% 40%, rgba(9, 163, 211, 0.12) 0%, transparent 60%),
                radial-gradient(ellipse 70% 50% at 85% 70%, rgba(58, 115, 125, 0.16) 0%, transparent 55%);
            -webkit-font-smoothing: antialiased;
        }

        h1 {
            margin: 0;
            font-family: var(--font-heading);
            font-size: var(--text-3xl);
            font-weight: 700;
            line-height: 1.2;
            color: var(--color-accent-yellow);
        }

        main {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            max-width: var(--max-width-content);
            gap: var(--space-4);
        }

        main p { margin: 0; max-width: 52ch; }

        .eyebrow {
            font-family: var(--font-accent);
            font-size: var(--text-sm);
            color: var(--color-blue-mid);
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }

        .divider {
            width: 40px;
            height: 2px;
            background: var(--color-blue-mid);
            border-radius: var(--radius-full);
            opacity: 0.5;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: var(--space-3) var(--space-6);
            font-family: var(--font-body);
            font-size: var(--text-base);
            font-weight: 600;
            text-decoration: none;
            background-color: var(--color-blue-light);
            color: var(--color-teal-dark);
            border: 2px solid transparent;
            border-radius: var(--radius-md);
            cursor: pointer;
            transition:
                background-color var(--transition-normal),
                color var(--transition-normal),
                transform var(--transition-bounce),
                box-shadow var(--transition-normal);
        }

        .btn:hover {
            background-color: var(--color-teal);
            color: var(--color-bg);
            box-shadow: var(--shadow-glow-blue);
            transform: scale(1.03);
        }

        .btn:active { transform: scale(0.98); }

        /* ── Fade-in ───────────────────────────────────────────── */

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .animate-fade-in-up {
            animation: fadeInUp var(--transition-slow) ease-out both;
        }

        /* ── Floating bubbles ──────────────────────────────────── */

        .bubbles {
            position: fixed;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .bubble {
            position: absolute;
            bottom: -24px;
            border-radius: 50%;
            border: 1px solid rgba(188, 228, 245, 0.18);
            background: rgba(9, 163, 211, 0.05);
            animation: floatUp linear infinite;
        }

        .bubble:nth-child(1) { width: 12px; height: 12px; left:  8%; animation-duration: 13s; animation-delay:  0s; }
        .bubble:nth-child(2) { width:  7px; height:  7px; left: 19%; animation-duration: 17s; animation-delay:  4s; }
        .bubble:nth-child(3) { width: 18px; height: 18px; left: 31%; animation-duration: 11s; animation-delay:  1s; }
        .bubble:nth-child(4) { width:  9px; height:  9px; left: 47%; animation-duration: 19s; animation-delay:  6s; }
        .bubble:nth-child(5) { width: 22px; height: 22px; left: 60%; animation-duration: 10s; animation-delay:  2s; }
        .bubble:nth-child(6) { width: 11px; height: 11px; left: 74%; animation-duration: 15s; animation-delay:  8s; }
        .bubble:nth-child(7) { width:  6px; height:  6px; left: 85%; animation-duration: 14s; animation-delay:  3s; }
        .bubble:nth-child(8) { width: 15px; height: 15px; left: 93%; animation-duration: 12s; animation-delay: 10s; }

        @keyframes floatUp {
            0%   { transform: translateY(0);      opacity: 0; }
            8%   { opacity: 0.8; }
            92%  { opacity: 0.4; }
            100% { transform: translateY(-105vh); opacity: 0; }
        }

        @media (prefers-reduced-motion: reduce) {
            .animate-fade-in-up { animation: none; }
            .bubble { animation: none; opacity: 0; }
        }

        @media (max-width: 600px) {
            h1 { font-size: var(--text-2xl); }
        }
    </style>
    <script defer data-domain="app.divemap.io" src="https://plausible.io/js/script.js"></script>
</head>
<body>
    <div class="bubbles" aria-hidden="true">
        <span class="bubble"></span>
        <span class="bubble"></span>
        <span class="bubble"></span>
        <span class="bubble"></span>
        <span class="bubble"></span>
        <span class="bubble"></span>
        <span class="bubble"></span>
        <span class="bubble"></span>
    </div>

    <main id="main-content" role="main" aria-label="Main content" class="animate-fade-in-up">
        <span class="eyebrow">Coming Soon</span>
        <h1>We're Building<br>Something New!</h1>
        <div class="divider" aria-hidden="true"></div>
        <p>Our application is temporarily unavailable as we work on something exciting and innovative. Thank you for your patience and support!</p>
        <a href="https://github.com/divemap-io" target="_blank" rel="noopener noreferrer" class="btn">Follow Our Progress on GitHub</a>
    </main>
</body>
</html>
